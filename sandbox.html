<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DevQuest sandbox</title>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      body { margin: 0; padding: 16px; font-size: 15px; color: #1d1b1a; background: #fbfaf8; }
      button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid #d4cfc9; background: #fff; cursor: pointer; }
      button:hover { background: #f3efe9; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #ff5a2c; outline-offset: 2px; }
      input, select, textarea { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #d4cfc9; }
      label { display: inline-flex; gap: 6px; align-items: center; }
      ul { padding-left: 20px; }
      [role="dialog"] { border: 1px solid #d4cfc9; border-radius: 12px; padding: 16px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
      [role="tab"][aria-selected="true"] { border-color: #ff5a2c; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/runners/sandbox.ts"></script>
  </body>
</html>
