# Builds DevQuest and publishes it to GitHub Pages on every push to main.
# Pull requests (e.g. from Dependabot) run the same checks but never deploy.
# One-time setup: repo → Settings → Pages → "Build and deployment" → Source: GitHub Actions.
#
# Actions are pinned to full commit SHAs (a moved tag can't change what runs here);
# Dependabot (.github/dependabot.yml) keeps the pins and the version comments up to date.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# least privilege by default; jobs ask for more only where needed
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Every challenge's solution is executed against its tests (and every starter must fail).
      - name: Validate lessons
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The production build in a real browser: every lesson renders, every challenge runs
      # through the real Web Worker / React sandbox / PGlite runners.
      - name: Install Chromium for the browser self-test
        run: npx playwright-core install --with-deps chromium

      - name: Browser self-test (production build)
        run: npm run selftest

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
