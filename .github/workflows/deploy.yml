# Builds DevQuest and publishes it to GitHub Pages on every push to main.
# One-time setup: repo → Settings → Pages → "Build and deployment" → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Every challenge's solution is executed against its tests (and every starter must fail).
      - name: Validate lessons
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The production build in a real browser: every lesson renders, every challenge runs
      # through the real Web Worker / React sandbox / PGlite runners.
      - name: Install Chromium for the browser self-test
        run: npx playwright-core install --with-deps chromium

      - name: Browser self-test (production build)
        run: npm run selftest

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
